<style>
:root{--bg:#e9f0f3;--ink:#14212b;--mut:#5d6f7b;--card:#fff;--g:#1f9d6b;--y:#f0a202;--r:#d9382b;--line:#cfdce3}
@media(prefers-color-scheme:dark){:root{--bg:#0f1a21;--ink:#eaf2f6;--mut:#93a6b2;--card:#182630;--line:#27394590}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Avenir Next","Trebuchet MS",system-ui,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));max-width:480px;margin:0 auto}
h1{font-size:1.15rem;margin:4px 0 0;letter-spacing:.01em}h2{font-size:1.9rem;line-height:1.1;margin:.2em 0 .3em}
.m{color:var(--mut);margin:.2em 0 1em;font-size:.92rem}
.card{background:var(--card);border-radius:18px;padding:16px;margin:0 0 12px;border:1px solid var(--line)}
label{display:block;font-size:.85rem;color:var(--mut);margin:12px 0 4px}
select,input{width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.row{display:flex;gap:8px}.row button{width:52px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:1.2rem}
.btn{display:block;width:100%;text-align:center;text-decoration:none;font:inherit;font-weight:700;padding:14px;border-radius:12px;border:0;background:var(--ink);color:var(--bg);margin-top:14px;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line);font-weight:500;margin-top:8px}
.hero{border:0;border-radius:26px;padding:22px 20px;color:#fff}.hero.g{background:var(--g)}.hero.y{background:var(--y);color:#2b1d00}.hero.r{background:var(--r)}
.hero p{margin:.15em 0;opacity:.92}.hero small{font-size:.9rem}
.strip{display:flex;gap:4px;overflow-x:auto;padding:10px 0 4px}
.chip{flex:0 0 46px;text-align:center;border-radius:8px;padding:8px 0;color:#fff;font-size:.9rem;line-height:1.2}.chip b{display:block;font-size:.75rem;opacity:.9}
.chip.g{background:var(--g)}.chip.y{background:var(--y);color:#2b1d00}.chip.r{background:var(--r)}
.best{font-weight:700;margin:6px 0 0}.warn{margin:0 0 12px;padding:12px 14px;border-radius:12px;background:var(--card);border-left:5px solid var(--y)}
.link{display:block;color:var(--ink);text-decoration:none;font-weight:700;border-radius:14px}
.pro{border:2px solid var(--ink)}.pro p{margin:.3em 0}
.top{display:flex;justify-content:space-between;align-items:center}.lang{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px}.pro ul{margin:.4em 0 0;padding-left:1.1em}.pro li{margin:.25em 0}
#acct input{margin-top:8px}
body{background:#fff;overflow-x:hidden}html{background:#fff;overflow-x:hidden}
@media(prefers-color-scheme:dark){:root{--bg:#fff;--ink:#14212b;--mut:#5d6f7b;--card:#fff;--line:#cfdce3}}
.hdr{text-align:center;margin-bottom:6px}.hdr .top{text-align:left}.hdr h1{font-size:1.5rem;font-weight:800}.hdr .m{color:var(--ink);opacity:.8;text-align:left;margin-bottom:0}
.hdr svg{display:block;width:190px;max-width:62%;margin:2px auto 0;overflow:visible}
#dog .sweat,#dog .spark{display:none}#dog.g .spark{display:block}#dog.r .sweat{display:block}#dog.r .tongue{display:none}
#dog.g{animation:hop 1s ease-in-out infinite;transform-origin:50% 100%}@keyframes hop{50%{transform:translateY(-9px) rotate(-2deg)}}
@media(prefers-reduced-motion:reduce){#dog.g{animation:none}}
.card{border-radius:22px;box-shadow:0 6px 0 rgba(20,33,43,.07)}
.btn{background:linear-gradient(135deg,#ff8a3d,#ff5e7e);color:#fff;border-radius:14px}.btn.ghost{background:none;color:var(--ink)}
.hero{border-radius:28px;box-shadow:0 8px 0 rgba(0,0,0,.12)}.hero h2{font-size:2.1rem;font-weight:800}
.pro{border:2px solid #ff8a3d;background:linear-gradient(160deg,var(--card),rgba(255,138,61,.12))}
.strip{padding:14px 0 8px;gap:6px}.chip{flex:0 0 54px;border-radius:16px;padding:10px 0;position:relative;box-shadow:0 3px 0 rgba(0,0,0,.14)}
.chip span{display:block;font-size:1.2rem;font-weight:800}.chip i{display:block;font-style:normal;font-size:.8rem;font-weight:700}
.chip.pick{outline:3px solid var(--ink);outline-offset:2px;transform:translateY(-4px)}
.bestbar{display:block;margin:10px 0 0;padding:12px 14px;border-radius:16px;text-align:center;font-weight:800;font-size:1.05rem;background:var(--line)}.bestbar:empty{display:none}
.bestbar.g{background:var(--g);color:#fff}.bestbar.y{background:var(--y);color:#2b1d00}.bestbar.r{background:var(--r);color:#fff}
.scale{height:8px;border-radius:99px;margin-top:6px;background:linear-gradient(90deg,hsl(210 85% 52%),hsl(126 85% 52%),hsl(56 85% 52%),hsl(28 85% 52%),hsl(0 85% 52%))}
body::before{content:'';position:fixed;inset:-10%;z-index:-2;pointer-events:none;background:radial-gradient(circle at 10% 8%,rgba(255,196,0,.5),transparent 38%),radial-gradient(circle at 92% 18%,rgba(0,170,255,.38),transparent 36%),radial-gradient(circle at 85% 88%,rgba(255,64,129,.32),transparent 38%),radial-gradient(circle at 8% 72%,rgba(0,214,143,.32),transparent 36%);animation:flash 9s ease-in-out infinite alternate}
@keyframes flash{0%{transform:scale(1);opacity:.85}50%{transform:scale(1.12) rotate(2deg);opacity:1}100%{transform:scale(1.04) rotate(-2deg);opacity:.8;filter:hue-rotate(45deg)}}
.card:not(.pro):not(.hero){background:rgba(255,255,255,.86);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hdr{position:relative}
.sun{position:absolute;z-index:-1;top:58px;right:6px;width:84px;height:84px;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 40% 35%,#fffbe0 0,#ffe066 35%,#ffb703 65%,#ff8f00 100%);box-shadow:0 0 40px 18px rgba(255,190,40,.55),0 0 90px 40px rgba(255,160,0,.25);animation:sunIn 3s cubic-bezier(.2,.7,.2,1) both,glow 3s ease-in-out 3s infinite alternate}
.sun::before{content:'';position:absolute;inset:-45%;border-radius:50%;background:repeating-conic-gradient(rgba(255,200,40,.6) 0 5deg,transparent 5deg 15deg);-webkit-mask:radial-gradient(circle,transparent 30%,#000 33%,transparent 70%);mask:radial-gradient(circle,transparent 30%,#000 33%,transparent 70%);animation:spin 40s linear infinite}
@keyframes sunIn{from{transform:translate(-70vw,90px) scale(.3);opacity:0}to{transform:none;opacity:1}}
@keyframes glow{to{box-shadow:0 0 56px 26px rgba(255,190,40,.7),0 0 110px 60px rgba(255,160,0,.3)}}@keyframes spin{to{transform:rotate(360deg)}}
#pack{display:flex;justify-content:center;align-items:flex-end;height:120px;margin-top:6px;cursor:pointer}#pack:empty{display:none}
#pack img{height:110px;width:auto;margin:0 -4px;transform-origin:50% 100%;animation:pop .6s calc(var(--i)*.15s) both}
@keyframes pop{from{transform:translateY(30px) scale(.6);opacity:0}to{transform:none;opacity:1}}
#pack img.run{animation:run 1.9s ease-in forwards}
@keyframes run{0%{transform:translate(0,0)}10%{transform:translate(0,-10px)}20%{transform:translate(10vw,0)}30%{transform:translate(22vw,-10px)}40%{transform:translate(36vw,0)}50%{transform:translate(50vw,-10px)}60%{transform:translate(64vw,0)}70%{transform:translate(80vw,-10px)}80%{transform:translate(95vw,0)}100%{transform:translate(130vw,0);visibility:hidden}}
body.photos #dog{display:none}
#wm{position:fixed;z-index:-1;left:0;bottom:0;width:100vw;max-width:760px;height:72vh;object-fit:cover;object-position:50% 12%;filter:grayscale(1) contrast(1.1);opacity:0;pointer-events:none;transition:opacity 2.5s}#wm.on{opacity:.09}
@media(prefers-reduced-motion:reduce){body::before,.sun,.sun::before,#pack img{animation:none}}

<script>

const B={'Alaskan Malamute':[4,-25],'Siberian Husky':[4,-25],'Samoyed':[4,-25],'Akita':[3,-15],'Chow Chow':[4,-15],'Great Pyrenees':[4,-25],'Golden Retriever':[2,-5],'Labrador':[1,-3],'German Shepherd':[2,-8],'Border Collie':[1,-8],'Bulldog':[5,2],'French Bulldog':[5,3],'Pug':[5,3],'Boston Terrier':[5,3],'Shih Tzu':[3,5],'Chihuahua':[0,10],'Mixed / other':[2,0]};
let L,T;try{L=localStorage.lang}catch(e){}L=L||((navigator.language||'en').startsWith('es')?'es':'en');
const TT={en:{sub:'Is it safe to walk your dog right now?',breed:'Breed',age:'Age',adult:'Adult',puppy:'Puppy',senior:'Senior (8+ years)',city:'City',save:'Check my dog',s0:'Good time for a walk',s1:'Short, easy walk only',s2:'Do not walk now',feels:'Feels like',pave:'Pavement (est.)',hours:'Today by hour',best:'Best window',noSafe:'coolest available',rain:'Rain likely later today.',paveW:'Pavement may burn paws. Press the back of your hand on it for 7 seconds.',aff:'Cooling gear for hot days',pro:'Become a Founding Member',proTxt:'PawGuard Pro is planned for mid-February 2027. Founding Members get:',p1:'One full year of Pro, starting the day Pro launches',p2:'Planned Pro features: several dogs, scheduled morning alerts, vet-ready reports',p3:'Renew every year at the same $9.99, for life',nr:'Sales are final. Full refund only if Pro has not launched by March 31, 2027.',p4:'A say in what we build first',proBtn:'Join as Founding Member',alerts:'Enable alerts',on:'Alerts on',edit:'Edit dog or city',disc:'General guidance, not veterinary advice. Heavy panting, drooling or weakness: call a vet now.',here:'My location',locErr:'Location is blocked. Type your city instead.',nf:'City not found. Check the spelling.',legal:'Privacy and terms',now:'Now',attr:'Weather data by',acct:'Your account',acctTxt:'Log in to link your Founding Member purchase. We email you a code. No password needed.',send:'Email me a code',verify:'Log in',logout:'Log out',codePh:'Code from your email',sent:'Code sent. Check your inbox and spam folder.',founder:'Founding Member. Pro unlocks when it launches (planned mid-February 2027).',free:'Free plan. If you just paid, it can take up to 24 hours to show here.',aerr:'Something went wrong. Check your email and code, then try again.',late:'No more walk hours today.',net:'Could not load the weather. Check your connection.',noN:'Alerts are not supported in this browser. On iPhone, add PawGuard to your Home Screen first.'},
es:{sub:'¿Es seguro sacar a pasear a tu perro ahora?',breed:'Raza',age:'Edad',adult:'Adulto',puppy:'Cachorro',senior:'Senior (8+ años)',city:'Ciudad',save:'Revisar a mi perro',s0:'Buen momento para pasear',s1:'Solo un paseo corto y tranquilo',s2:'No pasear ahora',feels:'Sensación térmica',pave:'Pavimento (est.)',hours:'Hoy por hora',best:'Mejor horario',noSafe:'lo más fresco disponible',rain:'Es probable que llueva más tarde.',paveW:'El pavimento puede quemar las patas. Apoya el dorso de tu mano 7 segundos.',aff:'Equipo para refrescar en días de calor',pro:'Hazte miembro fundador',proTxt:'PawGuard Pro está planeado para mediados de febrero de 2027. Los miembros fundadores reciben:',p1:'Un año completo de Pro, desde el día en que Pro se lance',p2:'Funciones Pro planeadas: varios perros, alertas matutinas programadas, reportes para el veterinario',p3:'Renueva cada año al mismo precio de $9.99, de por vida',nr:'Las ventas son definitivas. Reembolso completo solo si Pro no se ha lanzado antes del 31 de marzo de 2027.',p4:'Voto sobre qué función construimos primero',proBtn:'Unirme como miembro fundador',alerts:'Activar alertas',on:'Alertas activadas',edit:'Cambiar perro o ciudad',disc:'Guía general, no es consejo veterinario. Jadeo fuerte, baba o debilidad: llama a un veterinario ya.',here:'Mi ubicación',locErr:'Ubicación bloqueada. Escribe tu ciudad.',nf:'Ciudad no encontrada. Revisa la ortografía.',legal:'Privacidad y términos',now:'Ahora',attr:'Datos del clima de',acct:'Tu cuenta',acctTxt:'Inicia sesión para vincular tu compra de miembro fundador. Te enviamos un código por correo. Sin contraseña.',send:'Enviarme un código',verify:'Iniciar sesión',logout:'Cerrar sesión',codePh:'Código de tu correo',sent:'Código enviado. Revisa tu bandeja y spam.',founder:'Miembro fundador. Pro se activa cuando se lance (previsto para mediados de febrero de 2027).',free:'Plan gratuito. Si acabas de pagar, puede tardar hasta 24 horas en aparecer aquí.',aerr:'Algo salió mal. Revisa tu correo y el código e intenta de nuevo.',late:'Ya no quedan horas de paseo hoy.',net:'No se pudo cargar el clima. Revisa tu conexión.',noN:'Las alertas no funcionan en este navegador. En iPhone, agrega PawGuard a tu pantalla de inicio primero.'}};
const $=q=>document.querySelector(q),esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
$('#breed').innerHTML=Object.keys(B).map(b=>`<option>${b}</option>`).join('');
let P=null,place=null;try{P=JSON.parse(localStorage.pg)}catch(e){}
const geo=async q=>{const r=await(await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&name='+encodeURIComponent(q))).json(),g=r.results&&r.results[0];if(!g)throw 0;return{n:g.name,lat:g.latitude,lon:g.longitude}};
const st=(h,P)=>{const[ho,co]=B[P.b],e=h.a+ho+P.a;let s=e>29||h.a<co-8?2:(e>24||h.a<co?1:0);const pv=h.u>=6&&h.t>=25?h.t+20:null;if(pv>=52)s=Math.max(s,1);if(pv>=57)s=2;return{s,pv}};

$('#city').oninput=()=>place=null;
$('#save').onclick=async()=>{try{$('#err').textContent='…';const pl=place||await geo($('#city').value);P={b:$('#breed').value,a:+$('#age').value,pl};try{localStorage.pg=JSON.stringify(P)}catch(e){}$('#err').textContent='';ev('check_dog');run()}catch(e){$('#err').textContent=T.nf}};

async function run(){
$('#setup').hidden=true;$('#res').hidden=false;$('#hero').className='card hero g';$('#hero').textContent='…';
try{
const r=await(await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${P.pl.lat}&longitude=${P.pl.lon}&hourly=temperature_2m,apparent_temperature,uv_index,precipitation_probability&timezone=auto&forecast_days=1`)).json();
const H=r.hourly,now=new Date(Date.now()+r.utc_offset_seconds*1000).getUTCHours(),C=['g','y','r'];
const hs=H.time.map((_,i)=>{const h={i,t:H.temperature_2m[i],a:H.apparent_temperature[i],u:H.uv_index[i],p:H.precipitation_probability[i]};return{...h,...st(h,P)}});
const c=hs[now],w=hs.filter(h=>h.i>=Math.max(now,5)&&h.i<=21);
$('#hero').className='card hero '+C[c.s];$('#dog').setAttribute('class',C[c.s]);
$('#hero').innerHTML=`<h2>${T['s'+c.s]}</h2><p>${esc(P.b)}, ${esc(P.pl.n)}</p><p>${T.feels}: ${Math.round(c.a)}°C</p>${c.pv?`<p>${T.pave}: ${Math.round(c.pv)}°C</p>`:''}`;
let m=0,b=[];if(w.length){m=Math.min(...w.map(h=>h.s));let q=[];w.forEach(h=>{if(h.s===m){q.push(h);if(q.length>b.length)b=[...q]}else q=[]})}
const bs=new Set(b.map(h=>h.i)),hu=a=>Math.round(Math.max(0,Math.min(210,210-(a-8)*7))),mk=['✓','!','✕'];
$('#strip').innerHTML=w.map(h=>{const u=hu(h.a);return`<div class="chip${bs.has(h.i)?' pick':''}" style="background:hsl(${u} 85% 52%);color:${u>35&&u<100?'#2b1d00':'#fff'}"><b>${h.i===now?T.now:h.i+'h'}</b><span>${Math.round(h.a)}°</span><i>${mk[h.s]}</i></div>`}).join('')||T.late;
const be=$('#best');be.className='bestbar '+(b.length?C[m]:'');be.textContent=b.length?`${T.best}: ${b[0].i}:00 to ${b[b.length-1].i+1}:00`+(m?` (${T.noSafe})`:''):'';
const bc=document.querySelector('.chip.pick');if(bc)$('#strip').scrollLeft=Math.max(0,bc.offsetLeft-70);
$('#warn').innerHTML=(w.some(h=>h.p>=60)?`<p class="warn">${T.rain}</p>`:'')+(c.pv>=52?`<p class="warn">${T.paveW}</p>`:'');
const a=$('#aff');a.hidden=c.s===0;a.href=CFG.AFF;a.textContent=T.aff;$('#pro').href=CFG.PRO;
if('Notification'in window&&Notification.permission==='granted'){$('#bell').textContent=T.on;if(c.s===2)navigator.serviceWorker.ready.then(g=>g.showNotification('PawGuard',{body:T.s2+': '+P.b,icon:'icon-192.png',tag:'pg'}))}
}catch(e){$('#hero').className='card hero r';$('#hero').textContent=T.net}}
let sb=null;try{if(CFG.SB_URL&&window.supabase)sb=window.supabase.createClient(CFG.SB_URL,CFG.SB_KEY)}catch(e){}
async function acct(){const a=$('#acct');if(!sb){a.hidden=true;return}a.hidden=false;
try{const{data:{session}}=await sb.auth.getSession();$('#out').hidden=!!session;$('#in').hidden=!session;
if(session){$('#who').textContent=session.user.email;const{data}=await sb.from('members').select('plan').maybeSingle();$('#plan').textContent=data?T.founder:T.free}}catch(e){}}
const msg=t=>$('#aerr').textContent=t||'';
$('#send').onclick=async()=>{msg('…');const{error}=await sb.auth.signInWithOtp({email:$('#em').value.trim(),options:{shouldCreateUser:true}});if(error)return msg(T.aerr);msg(T.sent);$('#codeRow').hidden=false};
$('#verify').onclick=async()=>{msg('…');const{error}=await sb.auth.verifyOtp({email:$('#em').value.trim(),token:$('#code').value.trim(),type:'email'});if(error)return msg(T.aerr);msg('');ev('login');acct()};
$('#logout').onclick=async()=>{await sb.auth.signOut();$('#codeRow').hidden=true;$('#code').value='';acct()};
function apply(){T=TT[L];document.documentElement.lang=L;document.querySelectorAll('[data-i]').forEach(e=>e.textContent=T[e.dataset.i]);$('#pro').textContent=T.proBtn+' ('+CFG.PRICE+')';$('#lang').textContent=L==='en'?'ES':'EN';$('#code').placeholder=T.codePh;acct();if(!$('#res').hidden)run()}
$('#lang').onclick=()=>{L=L==='en'?'es':'en';try{localStorage.lang=L}catch(e){}ev('lang_'+L);apply()};
$('#pro').onclick=()=>ev('founder_click');$('#aff').onclick=()=>ev('affiliate_click');
addEventListener('appinstalled',()=>ev('app_installed'));
if(CFG.UMAMI){const u=document.createElement('script');u.defer=true;u.src='https://cloud.umami.is/script.js';u.dataset.websiteId=CFG.UMAMI;document.head.appendChild(u)}
apply();
const play=()=>{const k=[...document.querySelectorAll('#pack img')],w=$('#wm');k.forEach(i=>{i.classList.remove('run');i.style.animation='none';void i.offsetWidth;i.style.animation=''});if(w)w.classList.remove('on');setTimeout(()=>{k.forEach(i=>i.dataset.run&&i.classList.add('run'));if(w)w.classList.add('on')},2600)};
addEventListener('load',()=>{if(document.querySelector('#pack img')){document.body.classList.add('photos');play()}});
$('#pack').onclick=play;
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
if(P&&B[P.b]){$('#breed').value=P.b;$('#age').value=P.a;$('#city').value=P.pl.n;place=P.pl;run()}
</script></body></html>
